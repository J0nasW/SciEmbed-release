# Stage 1: Domain-adaptive MLM pretraining with MosaicML Composer
model_name: "answerdotai/ModernBERT-base"
corpus_dir: ${env:WORK,./output}/mlm_corpus
output_dir: ${env:WORK,./output}/stage1_mlm

# Training hyperparameters
max_seq_length: 8192
mask_rate: 0.30
global_batch_size: 72
microbatch_size: 6
lr: 2e-5
warmup_steps: 2000
max_tokens: "10000000000tok"
precision: "amp_bf16"

# Checkpointing
save_interval: "2000ba"
autoresume: true
save_folder: ${env:WORK,./output}/stage1_mlm/checkpoints

# Evaluation (validation loss every 500 batches)
eval_interval: "500ba"
early_stopping_patience: 5  # halt after 5 evals with no improvement

# Logging
run_name: "stage1-mlm-modernbert"
