# Data scaling curve: 21M pairs (Signal A+B, ratio preserved)
output_dir: ${env:WORK,./output}/mixed_scale_21m
shard_size: 1000000
seed: 42

signals:
  citation_triplets:
    dir: ${env:WORK,./output}/citation_triplets
    pairs: 6000000
    pattern: "triplets_*.parquet"

  citation_contexts:
    dir: ${env:WORK,./output}/citation_contexts
    pairs: 15000000
    pattern: "context_pairs_*.parquet"
