# Citation triplet generation settings
datalake:
  db_path: ${env:DATALAKE_DB,/path/to/data/science_datalake/datalake.duckdb}
  read_only: true
  threads: 16
  memory_limit: "128GB"

output_dir: /path/to/data/sciembed_output/citation_triplets
num_triplets: 50000000
influential_only: true
max_abstract_chars: 512
negative_mix:
  same_topic: 0.5
  two_hop: 0.3
  random: 0.2
paper_pool_path: null
num_workers: 16
shard_size: 1000000
