# MLM corpus extraction settings
datalake:
  db_path: ${env:DATALAKE_DB,/path/to/data/science_datalake/datalake.duckdb}
  read_only: true
  threads: 16
  memory_limit: "128GB"

min_text_length: 1000
max_text_length: 500000
tokenizer: "answerdotai/ModernBERT-base"
max_seq_length: 8192
stride: 128
output_dir: /path/to/data/sciembed_output/mlm_corpus
num_workers: 16
shard_size_mb: 256
sources:
  - pmc
  - s2orc
  - arxiv
  - pes2o
