[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sciembed"
version = "0.1.0"
description = "Modern scientific embedding model built on ModernBERT"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
  { name = "Jonas Wilinski", email = "jonas.wilinski@tuhh.de" },
  { name = "Michael F\u00e4rber", email = "michael.faerber@tu-dresden.de" },
]
dependencies = [
    "torch>=2.4",
    "transformers>=4.48",
    "sentence-transformers>=3.4",
    "duckdb>=1.1",
    "omegaconf>=2.3",
    "typer>=0.9",
    "rich>=13.0",
    "wandb>=0.16",
    "pyarrow>=14.0",
    "tqdm>=4.66",
    "datasets>=2.14",
]

[project.optional-dependencies]
train = [
    "flash-attn>=2.5",
    "mosaicml>=0.27",
    "mosaicml-streaming>=0.9",
]
eval = [
    "mteb==2.12.15",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "datasets>=2.14",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[project.scripts]
sciembed = "sciembed.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/sciembed"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
